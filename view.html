<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0a0000">
  <title>View profile — OpenHat Security</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&family=Orbitron:wght@600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="css/app.css?v=theme1" id="theme-base">
  <link rel="stylesheet" href="" id="theme-overlay" disabled>
  <script src="js/theme-boot.js?v=theme1"></script>
</head>
<body>
  <div class="scan" aria-hidden="true"></div>
  <header class="page">
    <div class="topbar">
      <p class="brand"><span class="hat" aria-hidden="true"></span> OpenHat - ios-max-security</p>
      <a class="github-btn" href="https://github.com/openhat-security/ios-max-security"><span class="gh-mark" aria-hidden="true"></span> GitHub</a>
    </div>
    <div class="chrome">
      <label class="chrome-field">Style
        <select id="style-select">
          <option value="app">Red Hat</option>
          <option value="primer">Primer</option>
          <option value="paper">Paper</option>
          <option value="terminal">Terminal</option>
        </select>
      </label>
      <div class="color-toggle" role="group" aria-label="Color">
        <button type="button" data-color-set="system">Sys</button>
        <button type="button" data-color-set="light">Light</button>
        <button type="button" data-color-set="dark">Dark</button>
      </div>
    </div>
    <p class="kicker">iPhone security</p>
    <p class="badge">Audit · not an install</p>
    <h1 id="title">View profile</h1>
    <p class="lead" id="lead">Loading the exact file…</p>
  </header>

  <p><a href="./">← Back to levels</a></p>
  <main id="audit"></main>

  <script type="module" src="js/profile-view.js?v=levels4"></script>
</body>
</html>
