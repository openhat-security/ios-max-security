<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0a0000">
  <title>View profile — OpenHat Security</title>
  <link rel="stylesheet" href="css/app.css?v=5" id="theme-base">
  <link rel="stylesheet" href="" id="theme-overlay" disabled>
  <script src="js/theme-boot.js?v=5"></script>
</head>
<body>
  <div class="scan" aria-hidden="true"></div>
  <header class="page">
    <div class="topbar">
      <a class="brand" href="./"><span class="hat" aria-hidden="true"></span> OpenHat - ios-max-security</a>
      <a class="github-btn" href="https://github.com/openhat-security/ios-max-security"><span class="gh-mark" aria-hidden="true"></span> GitHub</a>
    </div>
    <div class="chrome">
      <label class="chrome-field">Style
        <select id="style-select">
          <option value="app">Red Hat</option>
          <option value="primer">Primer</option>
          <option value="paper">Paper</option>
          <option value="terminal">Terminal</option>
        </select>
      </label>
      <div class="color-toggle" role="group" aria-label="Color">
        <button type="button" data-color-set="system">Sys</button>
        <button type="button" data-color-set="light">Light</button>
        <button type="button" data-color-set="dark">Dark</button>
      </div>
    </div>
    <p class="kicker">iPhone security</p>
    <p class="badge">Audit · not an install</p>
    <h1 id="title">View profile</h1>
    <p class="lead" id="lead">Loading the exact file…</p>
  </header>

  <p><a href="./">← Back to levels</a></p>
  <main id="audit"></main>

  <script type="module" src="js/profile-view.js?v=5"></script>
</body>
</html>
